<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Petit Chef</title>

  <!-- Polices pixel (Google Fonts) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;700&display=swap">

  <!-- Styles : d'abord la base, puis chaque fonctionnalité -->
  <link rel="stylesheet" href="base/base.css">
  <link rel="stylesheet" href="accueil/accueil.css">
  <link rel="stylesheet" href="preparation/preparation.css">
  <link rel="stylesheet" href="cuisine/cuisine.css">
  <link rel="stylesheet" href="fin-recette/fin-recette.css">
  <link rel="stylesheet" href="grimoire/grimoire.css">
</head>
<body>

  <!-- Un seul écran est visible à la fois : les autres ont l'attribut "hidden" -->

  <!-- ===== 1. ACCUEIL ===== -->
  <main id="ecran-accueil" class="ecran">
    <header class="entete-joueur cadre">
      <span class="sprite sprite-temp">C</span>
      <div class="entete-infos">
        <h2 id="entete-niveau">Niv. 1 · Commis</h2>
        <div class="barre-xp">
          <div id="entete-barre" class="barre-xp-remplissage"></div>
        </div>
        <p id="entete-xp" class="entete-xp">0 / 70 XP</p>
      </div>
    </header>

    <!-- Le menu : on choisit où aller -->
    <nav class="menu-accueil">
      <button id="menu-recettes" class="bouton bouton-large bouton-menu">
        RECETTES ▶
        <span class="menu-sous-titre">Choisir un plat à cuisiner</span>
      </button>
      <button id="menu-grimoire" class="bouton bouton-large bouton-menu">
        GRIMOIRE ▶
        <span class="menu-sous-titre">Relire les recettes déjà cuisinées</span>
      </button>
    </nav>
  </main>

  <!-- ===== RECETTES : une carte par recette ===== -->
  <main id="ecran-recettes" class="ecran" hidden>
    <div class="barre-haut">
      <button id="recettes-retour" class="bouton-icone" aria-label="Retour à l'accueil">←</button>
      <h2>Tes recettes</h2>
    </div>
    <!-- Les cartes sont créées par accueil.js à partir de la liste des recettes -->
    <section id="grille-recettes" class="grille-recettes"></section>
  </main>

  <!-- ===== GRIMOIRE : les recettes déjà cuisinées ===== -->
  <main id="ecran-grimoire" class="ecran" hidden>
    <div class="barre-haut">
      <button id="grimoire-retour" class="bouton-icone" aria-label="Retour à l'accueil">←</button>
      <h2>Grimoire</h2>
    </div>
    <p id="grimoire-compte" class="grimoire-compte"></p>
    <!-- La liste est créée par grimoire.js -->
    <ul id="liste-grimoire" class="liste-grimoire"></ul>
  </main>

  <!-- ===== FICHE D'UNE RECETTE (depuis le Grimoire) ===== -->
  <main id="ecran-fiche" class="ecran" hidden>
    <div class="barre-haut">
      <button id="fiche-retour" class="bouton-icone" aria-label="Retour au Grimoire">←</button>
      <h2 id="fiche-titre"></h2>
    </div>

    <div class="prepa-resume cadre">
      <div id="fiche-sprite"></div>
      <p id="fiche-infos"></p>
    </div>

    <div id="fiche-recap" class="recap cadre"></div>

    <button id="fiche-cuisiner" class="bouton bouton-large">CUISINER ▶</button>
  </main>

  <!-- ===== 2. PRÉPARATION ===== -->
  <main id="ecran-preparation" class="ecran" hidden>
    <div class="barre-haut">
      <button id="prepa-retour" class="bouton-icone" aria-label="Retour à l'accueil">←</button>
      <h2 id="prepa-titre"></h2>
    </div>

    <div class="prepa-resume cadre">
      <div id="prepa-sprite"></div>
      <p id="prepa-infos"></p>
    </div>

    <h3 class="titre-section">Ingrédients</h3>
    <ul id="prepa-ingredients" class="liste-a-cocher cadre"></ul>

    <h3 class="titre-section">Ustensiles</h3>
    <ul id="prepa-ustensiles" class="liste-a-cocher cadre"></ul>

    <button id="prepa-commencer" class="bouton bouton-large">COMMENCER ▶</button>
  </main>

  <!-- ===== 3. CUISINE ===== -->
  <main id="ecran-cuisine" class="ecran" hidden>
    <div class="barre-haut">
      <button id="cuisine-quitter" class="bouton-icone" aria-label="Quitter la recette">✕</button>
      <span id="cuisine-progression"></span>
    </div>
    <div id="cuisine-pastilles" class="pastilles"></div>

    <!-- L'ustensile et ce qu'on a mis dedans -->
    <div id="cuisine-scene" class="scene">
      <div id="cuisine-ustensile"></div>
      <div id="cuisine-contenu" class="contenu-ustensile"></div>
    </div>

    <div class="dialogue">
      <p id="cuisine-texte"></p>
      <p id="cuisine-aide" class="aide" hidden></p>
    </div>
    <button id="cuisine-precedente" class="bouton-lien">◀ Étape précédente</button>

    <!-- Étape "ajouter" : le plateau d'ingrédients -->
    <div id="zone-plateau" class="zone-bas" hidden>
      <div id="cuisine-plateau" class="plateau"></div>
    </div>

    <!-- Étape "action" : taper plusieurs fois -->
    <div id="zone-action" class="zone-bas" hidden>
      <button id="action-bouton" class="bouton bouton-large"></button>
      <div class="barre-xp">
        <div id="action-jauge" class="barre-xp-remplissage"></div>
      </div>
    </div>

    <!-- Étape "cuisson" : le minuteur -->
    <div id="zone-cuisson" class="zone-bas" hidden>
      <p id="minuteur-affichage" class="minuteur">00:00</p>
      <button id="minuteur-lancer" class="bouton bouton-large">LANCER ▶</button>
      <button id="minuteur-suivant" class="bouton bouton-large" hidden>ÉTAPE SUIVANTE ▶</button>
      <button id="minuteur-passer" class="bouton-lien">Passer le minuteur</button>
    </div>

    <!-- Confirmation avant de quitter (fenêtre par-dessus l'écran, cachée par défaut) -->
    <dialog id="confirmer-quitter" class="dialogue fenetre">
      <p>* Tu veux vraiment quitter ?</p>
      <p>* Ta progression sur cette recette sera perdue.</p>
      <button id="quitter-non" class="bouton bouton-large">CONTINUER ▶</button>
      <button id="quitter-oui" class="bouton-lien">Quitter la recette</button>
    </dialog>
  </main>

  <!-- ===== 4. FIN DE RECETTE ===== -->
  <main id="ecran-fin" class="ecran" hidden>
    <h2 class="titre-fin">★ RECETTE TERMINÉE ★</h2>
    <div id="fin-sprite" class="fin-sprite"></div>
    <h3 id="fin-nom" class="fin-nom"></h3>

    <button id="fin-jai-fini" class="bouton bouton-large">J'AI FINI !</button>

    <div id="fin-resultats" hidden>
      <p id="fin-gain" class="fin-gain"></p>
      <div class="barre-xp">
        <div id="fin-barre" class="barre-xp-remplissage"></div>
      </div>
      <p id="fin-xp" class="entete-xp"></p>

      <div id="fin-dialogue" class="dialogue"></div>

      <details class="recap cadre">
        <summary>Récap de la recette</summary>
        <div id="fin-recap"></div>
      </details>

      <button id="fin-retour" class="bouton bouton-large">RETOUR ▶</button>
    </div>
  </main>

  <!-- Scripts : les outils communs, les données, chaque fonctionnalité, puis main.js en dernier -->
  <script src="base/outils.js"></script>
  <script src="recettes/ingredients.js"></script>
  <script src="recettes/recettes.js"></script>
  <script src="joueur/xp.js"></script>
  <script src="joueur/joueur.js"></script>
  <script src="sauvegarde/sauvegarde.js"></script>
  <script src="accueil/accueil.js"></script>
  <script src="preparation/preparation.js"></script>
  <script src="cuisine/cuisine.js"></script>
  <script src="fin-recette/fin-recette.js"></script>
  <script src="grimoire/grimoire.js"></script>
  <script src="main.js"></script>
</body>
</html>
